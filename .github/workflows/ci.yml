name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke CLI
        run: |
          ./target/release/mayrun init --force
          ./target/release/mayrun check 'git status'
          # Deny exits 3; bash -e would abort on `; test $?` — capture under `if`.
          if ./target/release/mayrun check 'rm -rf /'; then
            echo "expected deny (exit 3), got allow" >&2
            exit 1
          else
            test $? -eq 3
          fi
          ./target/release/mayrun shell-hook --shell bash | head -n 2
          ./target/release/mayrun setup cursor | python3 -c "import sys,json; json.load(sys.stdin)"
      - name: Pack scoreboard (fail on recall regression)
        run: |
          ./target/release/mayrun scoreboard --corpus tests/corpus.yaml --min-recall 1.0
          ./target/release/mayrun scoreboard --corpus corpus/pins/network-exfil.yaml --min-recall 1.0

