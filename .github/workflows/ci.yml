name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Smoke CLI
        run: |
          ./target/release/mayrun init --force
          ./target/release/mayrun check 'git status'
          ./target/release/mayrun check 'rm -rf /' ; test $? -eq 3
