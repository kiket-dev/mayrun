# mayrun policy v1 — compose packs; add local overrides in rules.
# Evaluation: deny → require_approval → allow → default.
# Only deterministic rules can Allow. AI draft/tighten proposes YAML only.

apiVersion: mayrun.dev/v1
default: deny

extends:
  - pack: dangerous-defaults
  - pack: secrets-safe
  - pack: exec-escapes
  - pack: network-exfil
  - pack: shell-basics
  - pack: git-safe
  - pack: rust-dev
  - pack: ops-approve

# Optional local overrides (examples):
# rules:
#   - id: local.allow-just
#     effect: allow
#     reason: "Project just recipes"
#     match:
#       argv: { binary: just }
#
# Legacy flat lists still work alongside rules:
# deny:
#   - 'custom\\s+danger'
#
# For plan-mode agents, prefer extends: [dangerous-defaults, secrets-safe, read-only]
