[package]
name = "mayrun"
version = "0.1.0"
edition = "2024"
description = "Policy gate for coding-agent side effects — may this run?"
license = "MIT"
repository = "https://github.com/kiket-dev/mayrun"
homepage = "https://mayrun.dev"
readme = "README.md"
keywords = ["mcp", "agent", "policy", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mayrun"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
regex = "1"
rmcp = { version = "0.16", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "process",
    "fs",
    "time",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
