[package]
name = "mayrun"
version = "0.1.0"
edition = "2024"
description = "Policy gate for coding-agent side effects — may this run?"
license = "MIT"
repository = "https://github.com/kiket-dev/mayrun"
homepage = "https://mayrun.dev"
readme = "README.md"
keywords = ["mcp", "agent", "policy", "security", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mayrun"
path = "src/lib.rs"

[[bin]]
name = "mayrun"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
glob = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1"
rmcp = { version = "0.16", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "process",
    "fs",
    "time",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# cargo-dist — GitHub Releases on version tags (macOS/Linux; Windows best-effort).
[package.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
pr-run-mode = "plan"
