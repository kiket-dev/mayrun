<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
  <title>mayrun</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9EDF2"/>
      <stop offset="100%" stop-color="#DFE5EC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="420" width="1200" height="210" fill="#121820"/>
  <text x="72" y="160" font-family="ui-monospace, monospace" font-size="28" fill="#5A6A7A" letter-spacing="4">POLICY GATE</text>
  <text x="64" y="280" font-family="system-ui, sans-serif" font-size="120" font-weight="800" fill="#121820" letter-spacing="-4">mayrun</text>
  <text x="72" y="360" font-family="system-ui, sans-serif" font-size="36" font-weight="500" fill="#121820">Agents dont run dangerous commands</text>
  <text x="72" y="410" font-family="system-ui, sans-serif" font-size="36" font-weight="500" fill="#121820">until mayrun says they may.</text>
  <text x="72" y="510" font-family="ui-monospace, monospace" font-size="28" fill="#F0A39C">Deny  rm -rf /</text>
  <text x="72" y="560" font-family="ui-monospace, monospace" font-size="28" fill="#8FD4B4">Allow  cargo test</text>
</svg>
