# Network / secret egress — IMDS, pipe-to-shell, credential POST.
# Complements dangerous-defaults curl|sh and secrets-safe path exfil.
rules:
  - id: pack.net.deny-imds
    effect: deny
    reason: "Cloud instance metadata (IMDS) is a common credential exfil target"
    match:
      any:
        - regex: '169\.254\.169\.254'
        - regex: 'fd00:ec2::254'

  - id: pack.net.deny-pipe-shell
    effect: deny
    reason: "Download or stream piped to a shell"
    match:
      any:
        - regex: '(curl|wget|fetch)\b[^|\n]*\|\s*(ba)?sh\b'
        - regex: '(curl|wget)\b[^|\n]*\|\s*python(3)?\s*-?\s*$'

  - id: pack.net.deny-secret-egress
    effect: deny
    reason: "Obvious secret material posted or uploaded to the network"
    match:
      any:
        - regex: '(curl|wget)\b[^\n]*@(~?/)?\.(ssh|aws|gnupg|env|netrc|npmrc)\b'
        - regex: '(curl|wget)\b[^\n]*\s(-d|--data|--data-binary|-F|--form)\b[^\n]*(id_rsa|id_ed25519|\.pem\b|AWS_SECRET|GITHUB_TOKEN|BEGIN (RSA |OPENSSH )?PRIVATE)'
        - regex: '(env|printenv)\s*\|[^\n]*(curl|wget|nc|ncat)\b'
