# Block secret-path exfiltration; approve project-local .env reads.
# Known miss: $HOME/.ssh/... is not expanded — prefer ~/.ssh/ or absolute paths.
rules:
  - id: pack.secrets.deny-exfil
    effect: deny
    reason: "Reading or copying credential / key / history / cookie paths"
    match:
      capability_any: [secrets.exfil]

  - id: pack.secrets.deny-redirect-tricks
    effect: deny
    reason: "Shell redirect or here-string that targets secret paths"
    match:
      any:
        - regex: '(<|>|>>)\s*[^\s]*(/\.ssh/|\.aws/|\.gnupg|\.kube/config|\.netrc|\.npmrc|\.bash_history|\.zsh_history|id_rsa|id_ed25519|\.pem\b)'
        - regex: 'cat\s+[^\n|]*\.(pem|key)\b'
        - regex: '(curl|wget|nc|ncat)\s+[^\n]*@(~?/)?\.(ssh|aws|gnupg|env)'

  - id: pack.secrets.approve-dotenv
    effect: require_approval
    reason: "Project-local .env may be needed; confirm before reading"
    match:
      any:
        - regex: '(^|[\s;|&])(cat|head|tail|less|more|grep|rg|cp|mv|base64)\s+[^\n]*\.env(\.[\w.-]+)?(\s|$)'
        - argv: { binary: cat, args_contains: [".env"] }
        - argv: { binary: head, path_any: [".env"] }
